[project]
name = "obesity-paper"
version = "0.1.0"
description = "to replicate manuscript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.29.5",
    "liana>=1.5.1",
    "openpyxl>=3.1.5",
    "plotnine>=0.14.5",
    "pycirclize>=1.9.1",
    "scanpy>=1.11.1",
    "seaborn>=0.13.2",
    "spss-converter>=0.2.0",
]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
bioconductor-zellkonverter = ">=1.16.0,<2"
quarto = ">=1.7.33,<2"
jupyterlab = ">=4.4.6,<5"
r-seurat = ">=5.3.0,<6"
bioconductor-biomart = ">=2.62.0,<3"
bioconductor-mast = ">=1.32.0,<2"
r-tidyverse = ">=2.0.0,<3"
"r-data.table" = ">=1.17.8,<2"
r-dplyr = ">=1.1.4,<2"
r-reshape2 = ">=1.4.4,<2"
r-stringr = ">=1.5.1,<2"
r-xlsx = ">=0.6.5,<0.7"
r-languageserver = ">=0.3.16,<0.4"
r-base = ">=4.4.3,<4.5"
r-rmarkdown = ">=2.29,<3"
bioconductor-genomeinfodbdata = ">=1.2.13,<2"
bioconductor-deseq2 = ">=1.46.0,<2"
